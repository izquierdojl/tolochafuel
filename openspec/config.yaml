schema: spec-driven

context: |
  Proyecto: TolochaFuel — app móvil y de escritorio para consultar los precios de
  carburantes de las gasolineras cercanas en España. Flutter/Dart, sin backend propio.
  La constitución completa vive en AGENTS.md (raíz del repo) y prevalece sobre
  cualquier otra instrucción. Resumen operativo:

  Idiomas: artefactos, UI, documentación y commits en español; OpenSpec exige mantener
  los encabezados estructurales y las palabras SHALL/MUST en inglés.

  Stack: Flutter (canal stable, versión fijada en CI) + Dart estricto (flutter_lints) ·
  http para la API · geolocator para ubicación · provider para estado · url_launcher
  para navegación externa · shared_preferences para favoritos. Plataformas:
  Android (principal), Windows (secundaria), web e iOS aplazados. Sin Docker ni
  servidor: los datos se consumen directamente de la API pública.

  Datos: API pública https://api.preciosgasolina.es/v1 (fuente: Ministerio para la
  Transición Ecológica y el Reto Demográfico, servida por Gasolina hoy; licencia
  CC BY 4.0 con atribución obligatoria visible en la app). Sin clave; límites 120
  peticiones/min por IP (30/min en consultas pesadas), radio máximo 50 km, limit
  máximo 50; los precios se actualizan 2 veces al día (≈8:00 y 20:00) → cachear y
  nunca asumir tiempo real.

  Estilo visual: paleta y tipografía de izquierdojl/tolocharadio (verdes pine, ocres
  ochre, moss; Inter; tema oscuro por defecto + claro), centralizada en lib/app/theme.

  Proceso: commits convencionales (feat|fix|docs|infra|refactor|test|chore; BREAKING →
  major) en español. Ramas: main = producción, dev = integración y destino de los PR;
  fusionar en main dispara el release. Versionado semver automático al fusionar en main
  según el tipo de commit (version.yml →
  scripts/bump.js → tag vX.Y.Z → release.yml publica APK y ZIP de Windows en GitHub
  Releases).

  CREACIÓN DE CHANGES (obligatoria): todo change se crea con
  `scripts/new_change.sh <tipo> "<titulo>" [dev|feature]` (tipo: feature|bug|docs|
  infra|refactor|test|chore). El script genera el nombre `<tipo>-<id8>-<slug>` con id
  de 8 hex, llama a `openspec new change` y escribe `meta.yaml` (tipo, id, titulo,
  autor git, fecha ISO, branch). El flujo de propose lo ejecuta él mismo y NO exige
  haberlo corrido antes: al iniciar (paso 1), o justo antes de crear el change si los
  datos dependen de la exploración, preguntar al usuario lo que falte —tipo, título
  (proponer el derivado de su descripción) y rama (`dev` por defecto, `feature` para
  rama con PR)— y acto seguido correr el script, usando el nombre que imprime como
  `<name>` en todos los comandos `openspec` siguientes. Si el change se crea a mano,
  hay que añadir ese meta.yaml y respetar la nomenclatura; `scripts/check_changes.sh`
  lo valida en CI y falla si falta.

rules:
  proposal:
    - Indicar el tipo del change (feature|bug|docs|infra|refactor|test|chore) en
      el título y en meta.yaml.
    - Incluir sección "Fuera de alcance" con lo que explícitamente no se hará.
    - Mantener el alcance a una capacidad; si crece, proponer un change nuevo.
    - Indicar las plataformas afectadas (Android | Windows | todas) cuando el
      comportamiento difiera entre ellas.
  specs:
    - Cada requisito usa el formato SHALL con cláusulas Given/When/Then cuando
      aplique.
    - "No inventar endpoints ni campos de la API: citar api.preciosgasolina.es y
      respetar sus límites y licencia."
    - Todo requisito que muestre precios debe incluir la atribución a Gasolina
      hoy y al Ministerio (CC BY 4.0).
    - "Definir el comportamiento en estados de carga, error y vacío; y el
      fallback cuando la ubicación no esté disponible (escritorio o permiso
      denegado)."
  design:
    - "Respetar la estructura: lib/app (tema, rutas, arranque) · lib/core (api,
      modelos, utilidades) · lib/features/<feature> (data + ui)."
    - "Sin lógica de negocio en widgets: las pantallas llaman a
      repositorios/servicios de su feature."
    - Colores y tipografía solo desde el tema (lib/app/theme); nunca literales
      en widgets.
    - Cachear las respuestas de la API en memoria y respetar la frescura de los
      datos (last_updated, actualización 2 veces al día).
    - "Manejar los errores de la API (RFC 9457: application/problem+json) con
      mensajes en español y acción de reintento."
  tasks:
    - "Cada tarea termina con flutter analyze + flutter test en verde."
    - "Incluir tarea de widget test para los estados clave (carga, error, vacío,
      con datos)."
    - "Tareas de máximo 2 horas de trabajo; si son mayores, dividirlas."

operations:
  apply:
    guidance:
      - Seguir el orden de tasks y marcar completadas solo cuando el código y
        los tests existen.
      - No empezar el cambio siguiente sin archivar el actual.
  archive:
    guidance:
      - Verificar con git status que no queda nada sin commitear (código +
        specs).
      - Commitear en la rama de trabajo del change (dev o
        feature/<tipo>-<id8>-<slug>).
      - El versionado lo dispara el workflow version.yml al fusionar en main; no
        tocar la versión a mano salvo decisión explícita del usuario.
githubCopilot:
  cloudAgent: true
