name: Versionado

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: versionado-main
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: CI de la punta de dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! SHA="$(git rev-parse HEAD^2 2>/dev/null)"; then
            echo "main no apunta a un merge: no se publica sin CI verificada." >&2
            exit 1
          fi
          API="repos/${{ github.repository }}/actions/workflows/ci.yml/runs"
          INTENTO=0
          while [ "$INTENTO" -lt 40 ]; do
            PENDIENTES="$(gh api "$API?head_sha=$SHA&per_page=50" --jq '[.workflow_runs[] | select(.conclusion == null)] | length')"
            if [ "$PENDIENTES" -eq 0 ]; then
              break
            fi
            INTENTO=$((INTENTO + 1))
            sleep 15
          done
          VERDE="$(gh api "$API?head_sha=$SHA&per_page=50" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          ROJOS="$(gh api "$API?head_sha=$SHA&per_page=50" --jq '[.workflow_runs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure" or .conclusion == "action_required")] | length')"
          if [ "$VERDE" -eq 0 ] || [ "$ROJOS" -ne 0 ]; then
            echo "La CI de $SHA no está en verde: no se versiona ni se publica." >&2
            exit 1
          fi

  bump:
    needs: comprobar
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bump: ${{ steps.bump.outputs.bump }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Determinar tipo de bump
        id: bump
        run: |
          ULTIMO_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$ULTIMO_TAG" ]; then
            RANGO="HEAD"
          else
            RANGO="${ULTIMO_TAG}..HEAD"
          fi
          COMMITS=$(git log --pretty=%s "$RANGO")
          if [ -n "$ULTIMO_TAG" ] && [ -z "$COMMITS" ]; then
            echo "Sin cambios desde $ULTIMO_TAG; no se versiona"
            echo "bump=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Commits analizados:"
          echo "$COMMITS"
          BUMP=patch
          if echo "$COMMITS" | grep -qE '^[a-z]+(\([^)]+\))?!:'; then BUMP=major; fi
          if echo "$COMMITS" | grep -qE 'BREAKING CHANGE'; then BUMP=major; fi
          if echo "$COMMITS" | grep -qE '^feat(\([^)]+\))?:'; then BUMP=minor; fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Configurar identidad git
        if: steps.bump.outputs.bump != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Aplicar versión
        if: steps.bump.outputs.bump != ''
        run: node scripts/bump.js "${{ steps.bump.outputs.bump }}"

      - name: Publicar commit y tag
        if: steps.bump.outputs.bump != ''
        run: git push origin HEAD:main --follow-tags

  publicar:
    needs: bump
    if: ${{ needs.bump.outputs.bump != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
