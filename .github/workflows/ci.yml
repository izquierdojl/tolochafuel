name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Changes OpenSpec
        run: bash scripts/check_changes.sh

      - name: Dependencias Dart
        run: flutter pub get

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análisis
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Dependencias Node
        if: github.event_name == 'pull_request'
        run: npm ci

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
