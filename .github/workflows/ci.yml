name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Changes OpenSpec
        run: bash scripts/check_changes.sh

      - name: Dependencias Dart
        run: flutter pub get

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análisis
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Dependencias Node
        if: github.event_name == 'pull_request'
        run: npm ci

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//46 org.gnome.Sdk//46

      - name: Dependencias Dart
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Empaquetar (tar.gz, AppImage y Flatpak)
        run: bash packaging/linux/empaquetar.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-ci
          path: dist/tolochafuel-linux-x64.*
