name: Release

on:
  workflow_call:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Dependencias Dart
        run: flutter pub get

      - name: APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Dependencias Dart
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Empaquetar ZIP portable
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath tolochafuel-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: tolochafuel-windows-x64.zip

  publicar:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Versión del proyecto
        id: version
        run: |
          VERSION="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Preparar assets
        run: |
          mkdir -p release
          cp artefactos/apk/app-release.apk release/tolochafuel.apk
          cp artefactos/windows/tolochafuel-windows-x64.zip release/tolochafuel-windows-x64.zip

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --generate-notes --title "TolochaFuel $TAG"
          fi
