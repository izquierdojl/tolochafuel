name: Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Dependencias Dart
        run: flutter pub get

      - name: Firma de release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Faltan secretos de firma: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS o ANDROID_KEY_PASSWORD." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.jks"
          } > android/key.properties

      - name: APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Dependencias Dart
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Empaquetar ZIP portable
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath tolochafuel-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: tolochafuel-windows-x64.zip
          retention-days: 3

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev flatpak flatpak-builder elfutils imagemagick
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//46 org.gnome.Sdk//46

      - name: Dependencias Dart
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Empaquetar (tar.gz, AppImage y Flatpak)
        run: bash packaging/linux/empaquetar.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/tolochafuel-linux-x64.*
          retention-days: 3

  publicar:
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v8
        with:
          path: artefactos

      - name: Versión del proyecto
        id: version
        run: |
          VERSION="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Preparar assets
        run: |
          mkdir -p release
          cp artefactos/apk/app-release.apk release/tolochafuel.apk
          cp artefactos/windows/tolochafuel-windows-x64.zip release/tolochafuel-windows-x64.zip
          cp artefactos/linux/tolochafuel-linux-x64.tar.gz release/tolochafuel-linux-x64.tar.gz
          cp artefactos/linux/tolochafuel-linux-x64.AppImage release/tolochafuel-linux-x64.AppImage
          cp artefactos/linux/tolochafuel-linux-x64.flatpak release/tolochafuel-linux-x64.flatpak

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --generate-notes --title "TolochaFuel $TAG"
          fi
