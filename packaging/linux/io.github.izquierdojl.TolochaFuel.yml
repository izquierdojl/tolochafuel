app-id: io.github.izquierdojl.TolochaFuel
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: tolochafuel

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: tolochafuel
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin
      - cp -r tolochafuel data lib /app/bin/
      - install -Dm644 io.github.izquierdojl.TolochaFuel.desktop /app/share/applications/io.github.izquierdojl.TolochaFuel.desktop
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/io.github.izquierdojl.TolochaFuel.png
    sources:
      - type: dir
        path: .
